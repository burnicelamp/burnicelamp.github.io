<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121313" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Burnlamp 的私人世界：声场、银幕、书页、暗房与记录。"
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:url" content="https://burnlamp.is-my.id/" />
    <meta property="og:title" content="BURNLAMP｜一个私人世界" />
    <meta
      property="og:description"
      content="声场、银幕、书页、暗房与偶尔留下的记录。"
    />
    <meta
      property="og:image"
      content="https://burnlamp.is-my.id/assets/og-card.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>BURNLAMP｜一个私人世界</title>
    <link rel="canonical" href="https://burnlamp.is-my.id/" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./site.webmanifest" />
    <link
      rel="preload"
      as="image"
      href="./assets/portrait/dostoevsky-800.webp"
      imagesrcset="./assets/portrait/dostoevsky-480.webp 480w, ./assets/portrait/dostoevsky-800.webp 800w"
      imagesizes="(max-width: 700px) 100vw, 65vw"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "name": "BURNLAMP",
        "url": "https://burnlamp.is-my.id/",
        "mainEntity": {
          "@type": "Person",
          "name": "Burnlamp",
          "url": "https://burnlamp.is-my.id/"
        }
      }
    </script>
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#music">跳到内容</a>
    <header class="site-header">
      <a class="brand" href="#top"
        >BURNLAMP<span class="brand-dot" aria-hidden="true">.</span></a
      >
      <nav class="site-nav" aria-label="空间导航" data-navigation></nav>
      <div class="header-actions">
        <button data-search-open aria-label="搜索整个世界">
          搜索 <kbd>⌘ K</kbd></button
        ><button data-wander disabled>随便看看 ↗</button
        ><button
          class="nav-toggle"
          aria-expanded="false"
          aria-controls="mobile-nav"
        >
          目录 ＋
        </button>
      </div>
      <nav
        id="mobile-nav"
        aria-label="移动空间导航"
        hidden
        data-navigation
      ></nav>
    </header>
    <div class="cursor" aria-hidden="true"><i></i><b></b></div>
    <div class="notice" role="status" aria-live="polite"></div>
    <main>
      <section id="top" class="prologue" aria-labelledby="hero-title">
        <div class="hero-image" data-hero-image></div>
        <div class="hero-vignette" aria-hidden="true"></div>
        <div class="hero-copy">
          <p class="eyebrow" data-hero-eyebrow></p>
          <h1 id="hero-title"></h1>
        </div>
        <div class="hero-baseline">
          <span data-hero-footer></span
          ><a href="#music">进入声场 <span aria-hidden="true">↓</span></a>
        </div>
        <a
          class="portrait-credit"
          data-portrait-credit
          target="_blank"
          rel="noreferrer"
        ></a>
      </section>
      <noscript
        ><p class="load-error">
          请开启 JavaScript 进入各个空间。<a
            href="https://music.apple.com/cn/album/1519218381"
            >Apple Music 选辑 ↗</a
          >
        </p></noscript
      >
      <section id="music" class="space sound" aria-labelledby="music-title">
        <header class="space-heading" data-heading="music"></header>
        <div class="sound-layout">
          <div class="listening-desk">
            <div class="record-art" data-cover></div>
            <p class="eyebrow">NOW SELECTED <span data-source-label></span></p>
            <h3 data-current-track></h3>
            <p class="muted" data-current-artist></p>
            <div class="transport" role="group" aria-label="音乐播放控制">
              <button data-shuffle aria-label="随机播放" aria-pressed="false">
                ⤨</button
              ><button data-previous aria-label="上一首">←</button
              ><button class="play" data-play aria-label="播放" disabled>
                ▶</button
              ><button data-next aria-label="下一首">→</button
              ><button data-repeat aria-label="单曲循环" aria-pressed="false">
                ↻<small>1</small>
              </button>
            </div>
            <div class="timeline">
              <span data-elapsed>0:00</span
              ><input
                data-progress
                type="range"
                aria-label="播放进度"
                min="0"
                max="100"
                value="0"
                step="0.1"
                disabled
              /><span data-duration>0:00</span>
            </div>
            <label class="volume"
              >音量
              <input
                data-volume
                aria-label="音量"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.7"
                disabled
            /></label>
            <p class="source-status" data-player-status role="status"></p>
            <div data-provider-host></div>
            <a
              class="source-link"
              data-platform-link
              target="_blank"
              rel="noreferrer"
            ></a>
          </div>
          <div class="listening-text">
            <aside class="lyrics-card" aria-labelledby="lyrics-title">
              <header>
                <p class="eyebrow">WORDS IN THE AIR</p>
                <span data-lyrics-mode></span>
              </header>
              <h3 id="lyrics-title" class="sr-only" data-lyrics-title></h3>
              <div
                class="lyrics-viewport"
                data-lyrics-viewport
                tabindex="0"
                role="region"
                aria-label="歌词阅读区"
              ></div>
              <div class="lyrics-tools">
                <p data-lyrics-status></p>
                <button data-lyrics-resume hidden>回到当前句</button>
              </div>
              <div data-lyrics-attribution></div>
              <a
                data-lyrics-link
                class="sr-only"
                target="_blank"
                rel="noreferrer"
                >在平台查看当前曲目</a
              >
            </aside>
            <div class="queue-head">
              <h3>在这里听</h3>
              <button
                data-queue-toggle
                aria-expanded="true"
                aria-controls="queue"
              >
                播放队列 <span data-queue-count></span>
              </button>
            </div>
            <div id="queue">
              <label class="local-search"
                ><span>找一首歌</span
                ><input
                  data-music-search
                  type="search"
                  placeholder="歌名、艺人、标签"
                  aria-label="搜索音乐"
              /></label>
              <div data-track-list></div>
            </div>
            <div class="connections" data-music-relations></div>
          </div>
        </div>
      </section>
      <section id="cinema" class="space cinema" aria-labelledby="cinema-title">
        <header class="space-heading" data-heading="cinema"></header>
        <div class="space-toolbar">
          <label class="local-search"
            ><span>片目</span
            ><input
              data-cinema-search
              type="search"
              placeholder="片名、导演、年份、标签"
              aria-label="搜索电影"
          /></label>
          <div class="step-controls">
            <button data-cinema-prev aria-label="上一部电影">←</button
            ><span data-cinema-count aria-live="polite"></span
            ><button data-cinema-next aria-label="下一部电影">→</button>
          </div>
        </div>
        <div
          class="screening"
          tabindex="0"
          aria-label="私人放映厅，左右方向键切换"
        >
          <div class="film-stage" data-film-stage></div>
          <button
            class="next-frame"
            data-next-frame
            aria-label="下一部电影"
          ></button>
        </div>
      </section>
      <section
        id="reading"
        class="space reading"
        aria-labelledby="reading-title"
      >
        <header class="space-heading" data-heading="reading"></header>
        <div class="space-toolbar">
          <label class="local-search"
            ><span>书目</span
            ><input
              data-books-search
              type="search"
              placeholder="书名、作者、标签"
              aria-label="搜索书籍" /></label
          ><span data-book-status aria-live="polite"></span>
        </div>
        <div
          class="book-scene"
          tabindex="0"
          aria-label="阅读书页，左右方向键翻页"
        >
          <div
            class="author-bookmarks"
            aria-label="作者书签"
            data-authors
          ></div>
          <div class="book" data-book></div>
        </div>
        <div class="book-controls">
          <button data-book-prev>← 前一本</button
          ><button class="mobile-page-toggle" data-book-side>翻看右页 →</button
          ><span data-book-count aria-live="polite"></span
          ><button data-book-next>后一本 →</button>
        </div>
        <div class="connections book-connections" data-book-relations></div>
      </section>
      <section
        id="darkroom"
        class="space darkroom"
        aria-labelledby="darkroom-title"
      >
        <header class="space-heading" data-heading="darkroom"></header>
        <div
          class="roll-tabs"
          data-rolls
          role="group"
          aria-label="选择胶卷"
        ></div>
        <div class="contact-sheet" data-contact-sheet></div>
      </section>
      <section id="notes" class="space notes" aria-labelledby="notes-title">
        <header class="space-heading" data-heading="notes"></header>
        <div class="notes-list" data-notes></div>
      </section>
    </main>
    <footer class="site-footer">
      <a class="brand" href="#top">BURNLAMP.</a><span data-footer></span
      ><a href="#top">回到序幕 ↑</a>
    </footer>
    <dialog class="search-dialog" aria-labelledby="search-title">
      <div class="search-top">
        <span id="search-title">在这个世界里寻找</span
        ><button data-search-close aria-label="关闭搜索">Esc</button>
      </div>
      <div class="search-input-wrap">
        <span aria-hidden="true">⌕</span
        ><input
          id="global-query"
          type="search"
          autocomplete="off"
          placeholder="一个名字，一处地方，一段记忆…"
          aria-label="全局搜索"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="true"
          aria-controls="search-results"
          aria-describedby="search-help"
        />
      </div>
      <p id="search-help">试试 作者:陀思妥耶夫斯基 · 地点:武汉 · 年份:2026</p>
      <div id="search-results" role="listbox" aria-label="搜索结果"></div>
      <footer>
        <span data-search-count role="status"></span
        ><span>↑ ↓ 选择 · Enter 进入</span>
      </footer>
    </dialog>
    <dialog class="detail-dialog" aria-labelledby="detail-title">
      <button class="detail-close" data-detail-close aria-label="关闭详情">
        关闭 ×
      </button>
      <div data-detail-content></div>
    </dialog>
    <dialog class="enlarger" aria-label="暗房放大机">
      <header>
        <span data-photo-counter></span
        ><button data-photo-close aria-label="关闭照片">关闭 ×</button>
      </header>
      <div class="enlarger-image" data-enlarger-image></div>
      <footer>
        <button data-photo-prev aria-label="上一张照片">←</button>
        <div data-photo-caption></div>
        <button data-photo-next aria-label="下一张照片">→</button>
      </footer>
      <div class="connections" data-photo-relations></div>
    </dialog>
  </body>
</html>
